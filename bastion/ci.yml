---
.bastion:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "bastion/**/*"
    DIR_PATH: "bastion"

code-quality-bastion-terraform-lint:
  extends: [.bastion, .terraform_lint]

code-quality-bastion-terraform-fmt:
  extends: [.bastion, .terraform_fmt]

code-quality-bastion-yaml-lint:
  extends: [.bastion, .yaml_lint]

validate-syntax-bastion:
  extends: [.bastion, .validate_syntax]

validate-security-bastion:
  extends: [.bastion, .validate_security]

validate-security-checkov-bastion:
  extends: [.bastion, .validate_security_checkov]

build-bastion:
  rules:
    - if: $RULES_CHANGES_PATH != "bastion/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.bastion, .plan]
  needs: []

deploy-bastion:
  rules:
    - if: $RULES_CHANGES_PATH != "bastion/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.bastion, .apply]
  needs: ["build-bastion"]

destroy-bastion:
  rules:
    - if: $RULES_CHANGES_PATH != "bastion/**/*"
      when: never
    - !reference [.destroy, rules]
    - !reference [.base-rules, rules]
  extends: [.bastion, .destroy]
  needs: ["build-bastion"]
